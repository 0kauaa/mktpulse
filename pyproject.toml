[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mktpulse"
version = "0.1.0"
description = "Financial market data engineering platform for study and portfolio"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "pyarrow>=16,<22",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyspark>=4.0,<5",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34,<2"]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]
ml = [
    "joblib>=1.4,<2",
    "scikit-learn>=1.6,<2",
]
dashboard = [
    "plotly>=5.24,<7",
    "streamlit>=1.40,<2",
]

[project.scripts]
mktpulse = "mktpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
required-version = ">=0.11.21"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
